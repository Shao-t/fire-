<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="煙火">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>煙火特效</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #ui {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; z-index: 10;
    font-family: 'Georgia', serif;
  }
  .btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 13px;
    letter-spacing: 0.08em; cursor: pointer; backdrop-filter: blur(8px);
    transition: background 0.2s, border-color 0.2s; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover, .btn:active { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
  .btn.active { background: rgba(255,200,80,0.22); border-color: rgba(255,200,80,0.6); color: #ffe580; }
  #hint {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.35); font-family: 'Georgia', serif; font-size: 13px;
    letter-spacing: 0.12em; pointer-events: none; transition: opacity 1s;
  }
  #install-btn {
    display: none; position: fixed; top: 16px; right: 16px;
    background: rgba(255,200,80,0.15); border: 1px solid rgba(255,200,80,0.4);
    color: #ffe580; padding: 8px 16px; border-radius: 999px; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(8px); z-index: 20;
  }
  #type-label {
    position: fixed; top: 20px; right: 20px;
    color: rgba(255,220,120,0.75); font-family: 'Georgia', serif;
    font-size: 12px; letter-spacing: 0.15em; pointer-events: none;
    opacity: 0; transition: opacity 0.5s;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">點擊畫面 · 綻放煙火</div>
<div id="type-label"></div>
<div id="ui">
  <button class="btn" id="btnSingle">單發</button>
  <button class="btn active" id="btnAuto">自動</button>
  <button class="btn" id="btnBurst">連發</button>
</div>
<button id="install-btn">📲 安裝 App</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const typeLabel = document.getElementById('type-label');
let typeLabelTimer = null;
function showTypeLabel(text) {
  typeLabel.textContent = text;
  typeLabel.style.opacity = '1';
  if (typeLabelTimer) clearTimeout(typeLabelTimer);
  typeLabelTimer = setTimeout(() => { typeLabel.style.opacity = '0'; }, 1800);
}

const COLORS = [
  '#ff4466','#ff6644','#ffcc00','#44ffaa','#44aaff','#aa44ff',
  '#ff44ee','#ffffff','#ff8844','#88ff44','#44ffff','#ffaacc',
  '#ff99bb','#ffdd55','#55ffdd','#bb88ff','#ff5599','#aaffcc'
];
function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

// ── 普通粒子 ──────────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, color, life, size) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=this.maxLife=life;
    this.size=size||2.5; this.gravity=0.06; this.drag=0.97;
  }
  update() {
    this.vy+=this.gravity; this.vx*=this.drag; this.vy*=this.drag;
    this.x+=this.vx; this.y+=this.vy; this.life--;
  }
  draw() {
    const alpha = Math.pow(this.life/this.maxLife, 1.4);
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.shadowBlur=8; ctx.shadowColor=this.color; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size*alpha, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  get dead() { return this.life<=0; }
}

// ── 千輪粒子 ──────────────────────────────────────────
class RingParticle {
  constructor(x, y, vx, vy, color, life, ring, size) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=this.maxLife=life;
    this.size=size||2.2; this.ring=ring;
    this.gravity=0.018+ring*0.006; this.drag=0.985;
    this._pending=false; this._delay=0;
  }
  update() {
    this.vy+=this.gravity; this.vx*=this.drag; this.vy*=this.drag;
    this.x+=this.vx; this.y+=this.vy; this.life--;
  }
  draw() {
    const t=this.life/this.maxLife;
    const alpha = t<0.3 ? t/0.3*0.9 : Math.pow(t,1.2)*0.95;
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.shadowBlur=10; ctx.shadowColor=this.color; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y, this.size*Math.pow(t,0.4), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  get dead() { return this.life<=0; }
}

// ── 小花朵粒子 ────────────────────────────────────────
class FlowerPetal {
  constructor(x, y, vx, vy, color, life, petalCount) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=this.maxLife=life;
    this.petalCount=petalCount||(4+Math.floor(Math.random()*4));
    this.gravity=0.038; this.drag=0.955;
    this.rotation=Math.random()*Math.PI*2;
    this.rotSpeed=(Math.random()-0.5)*0.1;
    this.radius=2.8+Math.random()*3.0;
    this.innerR=this.radius*0.38;
  }
  update() {
    this.vy+=this.gravity; this.vx*=this.drag; this.vy*=this.drag;
    this.x+=this.vx; this.y+=this.vy;
    this.rotation+=this.rotSpeed; this.life--;
  }
  draw() {
    const t=this.life/this.maxLife;
    const alpha = t<0.2 ? (t/0.2)*0.95 : Math.pow(t,1.2)*0.95;
    const r=this.radius*(0.3+t*0.7);
    const inner=this.innerR*(0.3+t*0.7);
    const n=this.petalCount;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.shadowBlur=14;
    ctx.shadowColor=this.color;
    // 花瓣
    ctx.fillStyle=this.color;
    for (let i=0; i<n; i++) {
      const a=(i/n)*Math.PI*2;
      const cx=Math.cos(a)*r*0.65;
      const cy=Math.sin(a)*r*0.65;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, 0, inner*0.85, r*0.52, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
    // 花蕊
    ctx.shadowBlur=6;
    ctx.shadowColor='#ffffff';
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, inner*0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  get dead() { return this.life<=0; }
}

// ── 延遲花朵爆炸任務 ──────────────────────────────────
let pendingFlowerBursts = [];

function scheduleFlowerBurst(cx, cy) {
  // 60fps × 1秒 = 60 frames
  pendingFlowerBursts.push({ cx, cy, countdown: 60 });
}

function triggerFlowerBurst(cx, cy) {
  // 60～120朵
  const count = 60 + Math.floor(Math.random()*61);
  // 覆蓋半螢幕，drag=0.955，n≈45frames
  // 距離 ≈ v*(1-drag^n)/(1-drag) ≈ v*(1-0.955^45)/(0.045) ≈ v*19.5
  const halfScreen = Math.min(W, H) * 0.5;
  const baseSpeed = halfScreen / 19.5;

  for (let i=0; i<count; i++) {
    const angle = Math.random()*Math.PI*2;
    const speedMult = 0.25 + Math.random()*0.95;
    const speed = baseSpeed * speedMult;
    const vx = Math.cos(angle)*speed;
    const vy = Math.sin(angle)*speed;
    const color = randomColor();
    const life = 50+Math.floor(Math.random()*45);
    const petalCount = 4+Math.floor(Math.random()*5);
    particles.push(new FlowerPetal(cx, cy, vx, vy, color, life, petalCount));
  }
  // 中心閃光
  for (let i=0; i<35; i++) {
    const a=Math.random()*Math.PI*2;
    const s=0.3+Math.random()*2.2;
    particles.push(new Particle(cx, cy, Math.cos(a)*s, Math.sin(a)*s, '#ffffff', 38, 1.6));
  }
}

// ── Rocket ────────────────────────────────────────────
class Rocket {
  constructor(x, targetY, forcedType) {
    this.x=x; this.y=H; this.targetY=targetY;
    this.vy=-Math.abs((H-targetY)/45);
    this.vx=(Math.random()-0.5)*0.6;
    this.trail=[]; this.exploded=false;
    this.color=randomColor(); this.forcedType=forcedType;
  }
  update() {
    this.trail.push({x:this.x, y:this.y});
    if (this.trail.length>14) this.trail.shift();
    this.vy+=0.04; this.x+=this.vx; this.y+=this.vy;
    if (this.vy>=0 && !this.exploded) this.explode();
  }
  explode() {
    this.exploded=true;
    const useSenrin=this.forcedType==='senrin'||(!this.forcedType&&Math.random()<0.15);
    if (useSenrin) this.explodeSenrin();
    else this.explodeNormal();
    scheduleFlowerBurst(this.x, this.y);
  }
  explodeNormal() {
    const count=90+Math.floor(Math.random()*60);
    const type=Math.floor(Math.random()*5);
    for (let i=0; i<count; i++) {
      let angle, speed;
      if (type===0)      { angle=(i/count)*Math.PI*2; speed=3.5+Math.random()*0.8; }
      else if (type===1) { angle=(i/count)*Math.PI*2; speed=(i%3===0?5:2.5)+Math.random(); }
      else if (type===2) { angle=Math.random()*Math.PI*2; speed=1.5+Math.random()*4; }
      else if (type===3) { angle=(i/count)*Math.PI*2; speed=i%2===0?2.5:4.5; }
      else               { angle=Math.random()*Math.PI*2; speed=Math.random()*3; }
      const vx=Math.cos(angle)*speed, vy=Math.sin(angle)*speed;
      const c=type===3?(i%2===0?this.color:randomColor()):this.color;
      particles.push(new Particle(this.x,this.y,vx,vy,c,65+Math.floor(Math.random()*35)));
    }
    for (let i=0; i<18; i++) {
      const a=Math.random()*Math.PI*2, s=Math.random()*1.5;
      particles.push(new Particle(this.x,this.y,Math.cos(a)*s,Math.sin(a)*s,'#fff',90,1.2));
    }
  }
  explodeSenrin() {
    showTypeLabel('千輪');
    const numRings=3+Math.floor(Math.random()*3);
    const ringColors=senrinRingColors(this.color, numRings);
    for (let r=0; r<numRings; r++) {
      const delay=r*4, ringRadius=2.8+r*2.0;
      const count=48+r*16, life=70+r*8;
      for (let i=0; i<count; i++) {
        const angle=(i/count)*Math.PI*2, jitter=0.08;
        const vx=Math.cos(angle)*ringRadius*(1+(Math.random()-0.5)*jitter);
        const vy=Math.sin(angle)*ringRadius*(1+(Math.random()-0.5)*jitter);
        const p=new RingParticle(this.x,this.y,vx,vy,ringColors[r],life,r,2.0+r*0.2);
        p._delay=delay; p._delayX=this.x; p._delayY=this.y; p._pending=true;
        particles.push(p);
      }
    }
    for (let i=0; i<24; i++) {
      const a=Math.random()*Math.PI*2, s=0.4+Math.random()*1.2;
      particles.push(new Particle(this.x,this.y,Math.cos(a)*s,Math.sin(a)*s,'#ffffff',55,1.5));
    }
  }
  draw() {
    for (let i=0; i<this.trail.length; i++) {
      const alpha=(i/this.trail.length)*0.6;
      ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='#ffdd88';
      ctx.shadowBlur=6; ctx.shadowColor='#ff8800';
      ctx.beginPath(); ctx.arc(this.trail[i].x,this.trail[i].y,1.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.save(); ctx.globalAlpha=1; ctx.fillStyle='#fff';
    ctx.shadowBlur=10; ctx.shadowColor='#ffcc44';
    ctx.beginPath(); ctx.arc(this.x,this.y,2.5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  get dead() { return this.exploded && this.trail.length===0; }
}

function senrinRingColors(base, numRings) {
  const r=parseInt(base.slice(1,3)||'ff',16);
  const g=parseInt(base.slice(3,5)||'ff',16);
  const b=parseInt(base.slice(5,7)||'ff',16);
  const colors=[];
  for (let i=0; i<numRings; i++) {
    const t=i/Math.max(numRings-1,1);
    colors.push(`rgb(${Math.min(255,Math.round(r+(255-r)*(0.5-t*0.4)))},${Math.min(255,Math.round(g+(255-g)*(0.5-t*0.4)))},${Math.min(255,Math.round(b+(255-b)*(0.5-t*0.4)))})`);
  }
  return colors;
}

let particles=[], rockets=[], mode='auto', autoTimer=0;

function launch(x, y, forcedType) {
  if (!x) x=W*0.15+Math.random()*W*0.7;
  if (!y) y=H*0.1+Math.random()*H*0.4;
  x=Math.max(40,Math.min(W-40,x)); y=Math.max(60,Math.min(H*0.6,y));
  rockets.push(new Rocket(x,y,forcedType));
}

function burstLaunch() {
  const n=5+Math.floor(Math.random()*4);
  for (let i=0; i<n; i++) setTimeout(()=>launch(), i*120);
}

function loop() {
  requestAnimationFrame(loop);
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.fillRect(0,0,W,H);

  if (mode==='auto') {
    autoTimer++;
    if (autoTimer>=60) { autoTimer=0; Math.random()<0.7?launch():burstLaunch(); }
  }

  // 倒數花朵任務
  pendingFlowerBursts = pendingFlowerBursts.filter(b => {
    b.countdown--;
    if (b.countdown<=0) { triggerFlowerBurst(b.cx, b.cy); return false; }
    return true;
  });

  rockets = rockets.filter(r => { r.update(); if (!r.exploded) r.draw(); return !r.dead; });

  particles = particles.filter(p => {
    if (p._pending) {
      p._delay--;
      if (p._delay<=0) { p._pending=false; }
      else {
        ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p._delayX,p._delayY,1,0,Math.PI*2); ctx.fill(); ctx.restore();
        return true;
      }
    }
    p.update(); p.draw(); return !p.dead;
  });
}
loop();

canvas.addEventListener('click', e => {
  if (mode==='single'||mode==='auto') launch(e.clientX,e.clientY);
  else burstLaunch();
  fadeHint();
});
canvas.addEventListener('touchend', e => {
  const t=e.changedTouches[0];
  if (mode==='single'||mode==='auto') launch(t.clientX,t.clientY);
  else burstLaunch();
  fadeHint();
});
canvas.addEventListener('dblclick', e => { launch(e.clientX,e.clientY,'senrin'); fadeHint(); });

function setMode(m) {
  mode=m;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
}
document.getElementById('btnSingle').onclick=()=>setMode('single');
document.getElementById('btnAuto').onclick=()=>setMode('auto');
document.getElementById('btnBurst').onclick=()=>setMode('burst');

const hint=document.getElementById('hint');
let hintFaded=false;
function fadeHint() { if (hintFaded) return; hintFaded=true; hint.style.opacity='0'; }
setTimeout(fadeHint,4000);

let deferredPrompt;
const installBtn=document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt=e; installBtn.style.display='block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  if (outcome==='accepted') installBtn.style.display='none';
  deferredPrompt=null;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
