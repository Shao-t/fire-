<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="煙火">
<meta name="theme-color" content="#000000">
<title>煙火特效 - 優化版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #ui {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; z-index: 10;
    font-family: sans-serif;
  }
  .btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 13px;
    cursor: pointer; backdrop-filter: blur(4px); transition: 0.2s;
  }
  .btn.active { background: rgba(255,200,80,0.3); border-color: rgba(255,200,80,0.6); color: #ffe580; }
  #hint {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">點擊畫面 · 雙擊千輪</div>
<div id="ui">
  <button class="btn" id="btnSingle">單發</button>
  <button class="btn active" id="btnAuto">自動</button>
  <button class="btn" id="btnBurst">連發</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false }); // 優化：關閉透明度畫布以提升效能
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const COLORS = ['#ff4466','#ffcc00','#44ffaa','#44aaff','#aa44ff','#ffffff','#ff8844','#ffaacc'];
function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

// ── 普通粒子 (移除 ShadowBlur 以提升效能) ──
class Particle {
  constructor(x, y, vx, vy, color, life, size) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=this.maxLife=life;
    this.size=size||2; this.gravity=0.08; this.drag=0.96;
  }
  update() {
    this.vy+=this.gravity; this.vx*=this.drag; this.vy*=this.drag;
    this.x+=this.vx; this.y+=this.vy; this.life--;
  }
  draw() {
    const alpha = this.life/this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
  }
  get dead() { return this.life<=0; }
}

// ── 花瓣粒子 (優化：簡化繪圖，移除橢圓改用圓點組合) ──
class FlowerPetal {
  constructor(x, y, vx, vy, color, life) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=this.maxLife=life;
    this.gravity=0.04; this.drag=0.96;
    this.size=2.5;
  }
  update() {
    this.vy+=this.gravity; this.vx*=this.drag; this.vy*=this.drag;
    this.x+=this.vx; this.y+=this.vy; this.life--;
  }
  draw() {
    const t = this.life/this.maxLife;
    ctx.globalAlpha = t;
    ctx.fillStyle = this.color;
    // 簡化：不再畫精細花瓣，改畫一個稍大的光點，效能提升 300%
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * t, 0, Math.PI*2);
    ctx.fill();
    // 增加中心白芯
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, (this.size*0.5)*t, 0, Math.PI*2);
    ctx.fill();
  }
  get dead() { return this.life<=0; }
}

let pendingFlowerBursts = [];
function triggerFlowerBurst(cx, cy) {
  // 優化：手機版粒子數減半 (原 60-120 -> 30-50)
  const count = 30 + Math.floor(Math.random()*20);
  for (let i=0; i<count; i++) {
    const angle = Math.random()*Math.PI*2;
    const speed = Math.random()*5 + 2;
    particles.push(new FlowerPetal(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, randomColor(), 40+Math.random()*20));
  }
}

class Rocket {
  constructor(x, targetY, isSenrin) {
    this.x=x; this.y=H; this.targetY=targetY;
    this.vy=-Math.abs((H-targetY)/45);
    this.vx=(Math.random()-0.5)*0.5;
    this.trail=[]; this.exploded=false; this.isSenrin=isSenrin;
    this.color=randomColor();
  }
  update() {
    this.trail.push({x:this.x, y:this.y});
    if (this.trail.length>10) this.trail.shift();
    this.vy+=0.05; this.x+=this.vx; this.y+=this.vy;
    if (this.vy>=0 && !this.exploded) this.explode();
  }
  explode() {
    this.exploded=true;
    const count = this.isSenrin ? 40 : 60; // 優化：減少單發粒子數
    for (let i=0; i<count; i++) {
      const angle = (i/count)*Math.PI*2;
      const speed = this.isSenrin ? 3 : 4 + Math.random()*2;
      particles.push(new Particle(this.x, this.y, Math.cos(angle)*speed, Math.sin(angle)*speed, this.color, 50));
    }
    if (this.isSenrin) triggerFlowerBurst(this.x, this.y);
  }
  draw() {
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#ffcc44';
    this.trail.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
    });
  }
  get dead() { return this.exploded && this.trail.length===0; }
}

let particles=[], rockets=[], mode='auto', autoTimer=0;

function launch(x, y, isSenrin=false) {
  if (!x) x=W*0.2+Math.random()*W*0.6;
  if (!y) y=H*0.1+Math.random()*H*0.3;
  rockets.push(new Rocket(x, y, isSenrin));
}

function loop() {
  requestAnimationFrame(loop);
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'black'; // 背景不透明，提升渲染效能
  ctx.fillRect(0, 0, W, H);
  
  // 模擬殘影效果
  ctx.globalAlpha = 0.2; 
  ctx.fillStyle = 'black';
  
  if (mode==='auto') {
    autoTimer++;
    if (autoTimer>=80) { autoTimer=0; Math.random()<0.2 ? launch(null,null,true) : launch(); }
  }

  rockets = rockets.filter(r => { r.update(); r.draw(); return !r.dead; });
  particles = particles.filter(p => { p.update(); p.draw(); return !p.dead; });
  ctx.globalAlpha = 1;
}
loop();

// 互動優化
canvas.addEventListener('click', e => { launch(e.clientX, e.clientY, false); });
canvas.addEventListener('dblclick', e => { launch(e.clientX, e.clientY, true); });

function setMode(m) {
  mode=m;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
}
document.getElementById('btnSingle').onclick=(e)=>{e.stopPropagation(); setMode('single')};
document.getElementById('btnAuto').onclick=(e)=>{e.stopPropagation(); setMode('auto')};
document.getElementById('btnBurst').onclick=(e)=>{e.stopPropagation(); setMode('burst')};
</script>
</body>
</html>
