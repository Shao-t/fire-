<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>煙火特效 - 音效優化版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #ui {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 10;
  }
  .btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 13px;
    cursor: pointer; backdrop-filter: blur(4px);
  }
  .btn.active { background: rgba(255,200,80,0.3); border-color: rgba(255,200,80,0.6); color: #ffe580; }
  #hint {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none;
    text-align: center;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">點擊畫面開啟音效<br>單擊煙火 · 雙擊千輪</div>
<div id="ui">
  <button class="btn" id="btnSingle">單發</button>
  <button class="btn active" id="btnAuto">自動</button>
  <button class="btn" id="btnBurst">連發</button>
</div>

<script>
// ── 音效引擎 (Web Audio API) ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playPopSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'launch') {
    // 升空聲：高頻滑向低頻
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.8);
  } else if (type === 'boom') {
    // 普通爆炸：白噪音模擬碎裂聲
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    noise.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noise.start();
  } else if (type === 'senrin') {
    // 千輪專屬：多次清脆的小爆裂聲
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        const s = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        s.type = 'sine';
        s.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        s.connect(g); g.connect(audioCtx.destination);
        s.start(); s.stop(audioCtx.currentTime + 0.1);
      }, i * 50);
    }
  }
}

// ── 煙火邏輯 (延續優化版) ──
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const COLORS = ['#ff4466','#ffcc00','#44ffaa','#44aaff','#aa44ff','#ffffff','#ff8844','#ffaacc'];
function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

class Particle {
  constructor(x, y, vx, vy, color, life, size) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.color=color; this.life=this.maxLife=life;
    this.size=size||2; this.gravity=0.08; this.drag=0.96;
  }
  update() {
    this.vy+=this.gravity; this.vx*=this.drag; this.vy*=this.drag;
    this.x+=this.vx; this.y+=this.vy; this.life--;
  }
  draw() {
    ctx.globalAlpha = this.life/this.maxLife;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
  }
  get dead() { return this.life<=0; }
}

class Rocket {
  constructor(x, targetY, isSenrin) {
    this.x=x; this.y=H; this.targetY=targetY;
    this.vy=-Math.abs((H-targetY)/45);
    this.vx=(Math.random()-0.5)*0.5;
    this.trail=[]; this.exploded=false; this.isSenrin=isSenrin;
    this.color=randomColor();
    playPopSound('launch'); // 播放升空音
  }
  update() {
    this.trail.push({x:this.x, y:this.y});
    if (this.trail.length>8) this.trail.shift();
    this.vy+=0.05; this.x+=this.vx; this.y+=this.vy;
    if (this.vy>=0 && !this.exploded) this.explode();
  }
  explode() {
    this.exploded=true;
    playPopSound(this.isSenrin ? 'senrin' : 'boom'); // 播放爆炸音
    const count = this.isSenrin ? 30 : 50;
    for (let i=0; i<count; i++) {
      const angle = (i/count)*Math.PI*2;
      const speed = this.isSenrin ? 3 : 5;
      particles.push(new Particle(this.x, this.y, Math.cos(angle)*speed, Math.sin(angle)*speed, this.color, 50));
    }
  }
  draw() {
    ctx.globalAlpha = 0.4; ctx.fillStyle = '#ffcc44';
    this.trail.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill(); });
  }
  get dead() { return this.exploded && this.trail.length===0; }
}

let particles=[], rockets=[], mode='auto', autoTimer=0;

function launch(x, y, isSenrin=false) {
  initAudio();
  if (!x) x=W*0.2+Math.random()*W*0.6;
  if (!y) y=H*0.1+Math.random()*H*0.3;
  rockets.push(new Rocket(x, y, isSenrin));
}

function loop() {
  requestAnimationFrame(loop);
  ctx.globalAlpha = 0.2; ctx.fillStyle = 'black'; ctx.fillRect(0, 0, W, H);
  if (mode==='auto') {
    autoTimer++;
    if (autoTimer>=80) { autoTimer=0; Math.random()<0.2 ? launch(null,null,true) : launch(); }
  }
  rockets = rockets.filter(r => { r.update(); r.draw(); return !r.dead; });
  particles = particles.filter(p => { p.update(); p.draw(); return !p.dead; });
}
loop();

canvas.addEventListener('click', e => { launch(e.clientX, e.clientY, false); });
canvas.addEventListener('dblclick', e => { launch(e.clientX, e.clientY, true); });

function setMode(m) {
  mode=m;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
}
document.getElementById('btnSingle').onclick=(e)=>{e.stopPropagation(); setMode('single')};
document.getElementById('btnAuto').onclick=(e)=>{e.stopPropagation(); setMode('auto')};
document.getElementById('btnBurst').onclick=(e)=>{e.stopPropagation(); setMode('burst')};
</script>
</body>
</html>
