<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>長岡祭典花火 - 彩雲孔雀千輪頂級版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; background: url("2e1978230ad31c8f6c88bff7cdb81595.jpeg") center/cover no-repeat; }
  #ui { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
  .btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 14px;
    cursor: pointer; backdrop-filter: blur(8px); transition: 0.3s;
  }
  .btn.active { background: rgba(255,200,80,0.3); border-color: #ffe580; color: #ffe580; }
  #type-label { position: fixed; top: 30px; right: 30px; color: #ffe580; font-size: 16px; letter-spacing: 0.2em; opacity: 0; transition: 0.5s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="type-label"></div>
<div id="ui">
  <button class="btn" id="btnPhoenix">復興祈願 ─ 不死鳥</button>
  <button class="btn" id="btnGiant">正三尺玉</button>
  <button class="btn active" id="btnSenrin">彩雲孔雀千輪</button>
  <button class="btn" id="btnColorChange">職人藝 ─ 變色菊</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mode = 'senrin'; // 預設改為千輪

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

class Particle {
  constructor(x, y, vx, vy, color, life, size, isKamuro = false, dragOverride = null, gravOverride = null) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.color = color; this.life = this.maxLife = life;
    this.size = size; this.isKamuro = isKamuro;
    // 物理引擎調整：為千輪客製化重力與阻力
    this.gravity = gravOverride || (isKamuro ? 0.012 : 0.04); 
    this.drag = dragOverride || (isKamuro ? 0.982 : 0.96); // 0.982 產生高級懸浮感
  }
  update() {
    if (this.isKamuro) this.gravity += 0.0003;
    this.vy += this.gravity; this.vx *= this.drag; this.vy *= this.drag;
    this.x += this.vx; this.y += this.vy; this.life--;
  }
  draw() {
    const lifeRatio = this.life / this.maxLife; // 1.0 (剛出生) -> 0.0 (消失)
    const alpha = Math.pow(lifeRatio, 1.2);
    ctx.globalAlpha = alpha;

    // 變色邏輯：如果是陣列，就根據比例選顏色；如果是字串，就用原色
    if (Array.isArray(this.color)) {
        if (lifeRatio > 0.6) {
            ctx.strokeStyle = this.color[0]; // 第一階段（剛爆炸）
        } else if (lifeRatio > 0.25) {
            ctx.strokeStyle = this.color[1]; // 第二階段（擴散中）
        } else {
            ctx.strokeStyle = this.color[2] || '#FFFFFF'; // 第三階段（消失前）
        }
    } else {
        ctx.strokeStyle = this.color;
    }

    ctx.lineWidth = this.size;
    ctx.beginPath();
    const trailLen = this.isKamuro ? 7 : 1.8;
    ctx.moveTo(this.x - this.vx * trailLen, this.y - this.vy * trailLen);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  }
}
class Rocket {
  constructor(targetX, targetY, type) {
    // 發射起點稍微隨機，避免每次都從同一個點出來
    this.x = targetX + (Math.random() * 60 - 30); 
    this.y = H + 50; // 從畫面下方更深處開始
    this.targetY = targetY;
    this.type = type;
    this.speed = 9+ Math.random() * 3; // 稍微調快初始速度，更有衝擊感
    this.vx = (targetX - this.x) / 90; // 輕微的偏向偏移
    this.life = true;
  }
  update() {
    this.y -= this.speed;
    this.x += this.vx;
    
    // 關鍵 1：微微抖動升空 (微小的隨機噪音)
    this.x += (Math.random() - 0.5) * 1.2;
    
    // 物理：模擬上升時的速度遞減（重力與空氣阻力）
    this.speed *= 0.982; 

    // 當到達目標高度或速度過慢時引爆
    if (this.y <= this.targetY || this.speed < 2.5) {
      this.life = false;
      triggerExplosion(this.x, this.y, this.type);
    }
  }
  draw() {
    // 關鍵 2：拖長尾效果 (火焰噴射尾焰)
    const trailLength = 18; // 尾跡長度（粒子數）
    for (let i = 0; i < trailLength; i++) {
      // 隨著 i 增加，粒子變得更透明、更小
      const ratio = 1 - i / trailLength;
      ctx.globalAlpha = Math.pow(ratio, 1.5) * 0.8; // 指數衰減，尾部更柔和
      
      // 顏色由金黃色轉向澄紅色，模擬冷卻的火藥
      const red = 255;
      const green = 160 + ratio * 60; // 靠近頭部更白 gold
      const blue = 80 + ratio * 60;
      ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
      
      ctx.beginPath();
      // 在 update 計算出的位置下方畫粒子，形成尾跡
      // 加入一點點隨機偏移 (jiggle)，讓尾焰看起來更像流體燃燒
      const trailX = this.x + (Math.random() - 0.5) * i * 0.15;
      const trailY = this.y + i * (this.speed * 0.4); // 根據速度動態調整尾跡間距
      
      const pSize = 1.8 + ratio * 1.8; // 頭部大，尾部小
      ctx.arc(trailX, trailY, pSize, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // 核心亮點 (最亮點)
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(this.x, this.y, 1.0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function showTypeLabel(text) {
  const label = document.getElementById('type-label');
  label.textContent = text; label.style.opacity = '1';
  setTimeout(() => { label.style.opacity = '0'; }, 2000);
}

function playFireworkSound() {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;

  const boomOsc = audioCtx.createOscillator();
  const boomGain = audioCtx.createGain();
  boomOsc.type = 'sine';
  boomOsc.frequency.setValueAtTime(160, now);
  boomOsc.frequency.exponentialRampToValueAtTime(30, now + 0.5);
  boomGain.gain.setValueAtTime(1.0, now);
  boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);
  boomOsc.connect(boomGain).connect(audioCtx.destination);
  boomOsc.start(now);
  boomOsc.stop(now + 1.5);

  const bufferSize = audioCtx.sampleRate * 1.6;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.6);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.45, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1800, now);
  filter.frequency.exponentialRampToValueAtTime(250, now + 1.3);
  noise.connect(filter).connect(noiseGain).connect(audioCtx.destination);
  noise.start(now);
  noise.stop(now + 1.8);

  const subOsc = audioCtx.createOscillator();
  const subGain = audioCtx.createGain();
  subOsc.type = 'triangle';
  subOsc.frequency.setValueAtTime(45, now);
  subGain.gain.setValueAtTime(0.18, now);
  subGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.6);
  subOsc.connect(subGain).connect(audioCtx.destination);
  subOsc.start(now);
  subOsc.stop(now + 1.6);
}

function triggerExplosion(cx, cy, type) {
  playFireworkSound();
  if (type === 'phoenix') {
    showTypeLabel('復興祈願 ─ 不死鳥');
    for (let i = 0; i < 300; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.5 + Math.random() * 8.5;
      const life = 180 + Math.random() * 120;
      let pColor = speed > 7.5 ? '#FFFFFF' : (speed > 4.5 ? '#FFD700' : '#FF8C00');
      particles.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, pColor, life, 2.2, true));
    }
  } else if (type === 'giant') {
    showTypeLabel('正三尺玉');
    for (let i = 0; i < 500; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 10;
      const life = 100 + Math.random() * 60;
      let pColor = speed > 10 ? '#FFFFFF' : (speed > 6 ? '#FFD700' : '#E35D00');
      particles.push(new Particle(cx, cy, Math.cos(angle)*speed, Math.sin(angle)*speed, pColor, life, 3, false));
    }
  } else if (type === 'senrin') {
    showTypeLabel('彩雲孔雀千輪');
    
    // 1. 同步觸發中心金色支撐（影片 00:00:11 處的核心）
    for (let k = 0; k < 120; k++) {
        const a = Math.random() * Math.PI; // 向上半圓
        const s = 1 + Math.random() * 5;
        // 核心粒子重力稍大，模擬影片中快速下垂
        particles.push(new Particle(cx, cy, Math.cos(a)*s, -Math.abs(Math.sin(a)*s), '#FFD700', 120, 1.2, true, 0.97, 0.02));
    }

    const smallBallCount = 35; // 增加數量模擬影片的密集感
    for (let i = 0; i < smallBallCount; i++) {
        const angle = (i / smallBallCount) * Math.PI * 2 + Math.random() * 0.2;
        const spreadSpeed = 7 + Math.random() * 8; // 增加擴散範圍
        const vx = Math.cos(angle) * spreadSpeed;
        const vy = Math.sin(angle) * spreadSpeed;
        
        // 2. 先產生一顆紅色母彈粒子，且帶有短尾巴（模擬影片 00:00:09 的先導火光）
        particles.push(new Particle(cx, cy, vx, vy, '#FF4400', 30, 2.5, true, 0.96));

        setTimeout(() => {
            // 3. 增加位移倍數（*28），讓空間感完全拉開 [00:00:13]
            const flowerX = cx + vx * 28; 
            const flowerY = cy + vy * 28;
            
            const colors = ['#FF1493', '#1E90FF', '#32CD32', '#FFD700', '#D87093', '#FFFFFF'];
            const flowerColor = colors[i % colors.length];
            
            const petalCount = 45; // 增加每朵花的粒子數，更立體
            for (let j = 0; j < petalCount; j++) {
                const pAngle = (j / petalCount) * Math.PI * 2;
                // 4. 關鍵：隨機化爆裂速度 (1~5)，讓小花有層次，不只是圓環
                const pSpeed = 1.0 + Math.random() * 4.0; 
                // 5. 關鍵：增加壽命 (160+100)，產生持久留痕感
                const pLife = 160 + Math.random() * 100;
                
                particles.push(new Particle(
                    flowerX, flowerY, 
                    Math.cos(pAngle) * pSpeed, 
                    Math.sin(pAngle) * pSpeed, 
                    flowerColor, 
                    pLife, 
                    1.8,   // 細膩粒子
                    true,  // 強制開啟長尾巴
                    0.982  // 極高空氣阻力，產生高級懸浮感
                ));
            }
        }, 500 + Math.random() * 200); 
    }
  }else if (type === 'colorChange') {
    showTypeLabel('三重變化菊');
    const count = 400;
    // 定義變色路徑：紅 -> 藍 -> 白
    const colorPath = ['#FF3333', '#3366FF', '#FFFFFF']; 
    
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 8;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      const life = 200 + Math.random() * 100;
      
      // 直接傳入顏色陣列
      particles.push(new Particle(cx, cy, vx, vy, colorPath, life, 2.5, false));
    }
  }
}

// 在 script 開頭新增一個陣列
let rockets = [];

function loop() {
  requestAnimationFrame(loop);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.16)'; 
  ctx.fillRect(0,0,W,H);
  
  // 更新與繪製火箭
  rockets = rockets.filter(r => { 
    r.update(); 
    r.draw(); 
    return r.life; 
  });

  // 更新與繪製粒子
  particles = particles.filter(p => { 
    p.update(); 
    p.draw(); 
    return p.life > 0; 
  });
}

function handleInteract(e) {
  const x = e.type === 'touchend' ? e.changedTouches[0].clientX : e.clientX;
  const y = e.type === 'touchend' ? e.changedTouches[0].clientY : e.clientY;
  
  // 建立火箭，它會自動在到達 y 時引爆對應的 mode
  rockets.push(new Rocket(x, y, mode));
}
function setMode(m) {
  mode = m;
  // 移除所有按鈕的 active 樣式
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  
  // 根據模式名稱尋找對應按鈕並加上 active
  // 例如 mode 為 'colorChange'，則尋找 'btnColorChange'
  const targetId = 'btn' + m.charAt(0).toUpperCase() + m.slice(1);
  const targetBtn = document.getElementById(targetId);
  if (targetBtn) targetBtn.classList.add('active');
}

// 修正：將所有按鈕監聽器獨立出來，放在最外層（程式啟動即執行）
document.getElementById('btnPhoenix').onclick = () => setMode('phoenix');
document.getElementById('btnGiant').onclick = () => setMode('giant');
document.getElementById('btnSenrin').onclick = () => setMode('senrin');
document.getElementById('btnColorChange').onclick = () => setMode('colorChange');

// 1. 啟動動畫迴圈 (原本只有定義，沒有執行)
loop();

// 2. 綁定點擊與觸控事件到 Canvas 上 (這就是為什麼現在點了沒反應)
canvas.addEventListener('click', handleInteract);
canvas.addEventListener('touchend', handleInteract);
</script>
</body>
</html>
